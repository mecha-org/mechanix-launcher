name: mechanix-launcher
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Mufeed Ali <mufeeda@mechasystems.com>, Ayaskant Panigrahi <ayaskantp@mechasystems.com>, Naman Agrawal <namana@mechasystems.com>"
description: Launcher and shell UI for Mechanix OS
homepage: https://github.com/mecha-org/mechanix-launcher.git
license: BSD

depends:
  # The lock screen's PIN method.
  - pam_pwdfile
replaces:
  - mechanix-lockscreen

contents:
  - src: ./target/aarch64-unknown-linux-gnu/release/launcher
    dst: /usr/bin/mechanix-launcher
    file_info:
      mode: 0755

  - src: ./crates/lockscreen/resources/pam.d/mechanix
    dst: /etc/pam.d/mechanix
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./crates/lockscreen/resources/pam.d/mechanix-pin
    dst: /etc/pam.d/mechanix-pin
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./crates/lockscreen/resources/pam.d/mechanix-pin-check
    dst: /etc/pam.d/mechanix-pin-check
    type: config|noreplace
    file_info:
      mode: 0644
