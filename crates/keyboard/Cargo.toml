[package]
name = "keyboard"
version = "0.1.0"
edition = "2024"

[dependencies]
mecha-wayland.workspace = true
assets.workspace = true
gestures.workspace = true

tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10.7"
xkbcommon = { version = "0.9.0", features = ["wayland"] }
rustix = { version = "1.1.4", features = ["fs"] }
# Reads Noto Color Emoji's PNG glyph bitmaps (fontdue draws outlines only).
ttf-parser = "0.25"

# Hunspell bindings for the `hunspell` feature, linking the system's
# libhunspell via pkg-config (not the crate's bundled copy). Building needs
# hunspell-devel and clang-devel (bindgen).
hunspell-rs = { version = "0.4", default-features = false, optional = true }

# Only for the standalone `mechanix-osk` binary.
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = ["hunspell"]
# Builds the `mechanix-osk` binary: the keyboard as its own process, for
# shells other than the launcher. `cargo build -p keyboard --features standalone`
standalone = ["dep:tracing-subscriber"]
# Hunspell corrections in the suggestion bar, merged with the word list's
# completions. Reads the /usr/share/hunspell dictionaries at runtime; a
# missing dictionary leaves the source out.
hunspell = ["dep:hunspell-rs"]

[[bin]]
name = "mechanix-osk"
path = "src/bin/mechanix-osk.rs"
required-features = ["standalone"]
