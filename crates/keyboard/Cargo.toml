[package]
name = "keyboard"
version = "0.1.0"
edition = "2024"

[dependencies]
mecha-wayland.workspace = true
# The toolkit's protocol core, for `wp_fractional_scale_v1` (hand-written: the
# toolkit does not generate it). Same repo and revision as `mecha-wayland`.
mw-wayland = { package = "wayland", git = "https://github.com/mecha-org/mecha-wayland", branch = "dev" }
status-bar.workspace = true
gestures.workspace = true

tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10.7"
xkbcommon = { version = "0.9.0", features = ["wayland"] }
rustix = { version = "1.1.4", features = ["fs"] }
