# config for the entire keyboard layout
keyboard:
  mode: dark
  background: surface-container-low
  radius: none
  gap: 8
  row-gap: 12
  padding: 8
  width: 540
  height: 252
  font: geist
  font-size: 20

# Predictive touch: letter keys' touch areas lean toward likely next letters.
prediction:
  enabled: true      # false = plain geometry for every key
  strength: 0.25     # 0 = no bias; higher = stronger lean
  dictionary: en     # bundled list name, or a path to a word<TAB>count file
  terminal-dictionary: terminal  # used on terminal fields
  popup: true        # pop-up of the pressed character key

key_styles:
    normal:   { background: surface-container-high,    foreground: on-surface }
    number:   { background: surface-container-high,    foreground: on-surface,           font: geist-mono }
    function: { background: surface-container-highest, foreground: on-surface,           font: geist-mono, font-size: 18 }
    strip:    { background: surface-container-highest, foreground: on-surface,           font: geist-mono, font-size: 13 }
    bottom:   { background: surface-container-high,    foreground: on-surface,           font-size: 16 }
    done:     { background: on-secondary-container,    foreground: on-primary-container, font-size: 18 }
    latched:  { background: primary,                   foreground: on-primary }
    emoji:    { background: surface-container-highest, foreground: primary }

# Widths are flex weights within a row. AOSP's: a letter key is 10 % of the row;
# shift, backspace, ?123/ABC and enter are 15 %; space fills the rest.
outlines:
    default:     { width: 10 }
    wide:        { width: 15 }
    space:       { width: 40 }
    space_short: { width: 30 }
    strip:       { width: 12.5 }

# AOSP LatinIME English pages in the Mecha theme (see NOTICE-aosp.txt).
# Shift is state, not a page: uppercase is derived from the letter keys.
views:
    base:
        family: text
        page: letters
        more_keys: letters
        rows:
            - "q w e r t y u i o p"
            - "[5] a s d f g h j k l [5]"
            - "shift z x c v b n m BackSpace"
            - "to_symbols comma emoji space period Return"
    symbols:
        family: text
        page: symbols
        more_keys: symbols
        rows:
            - "1 2 3 4 5 6 7 8 9 0"
            - "[5] @ # $ % & - + ( ) [5]"
            - "to_more_symbols * \" ' : ; ! ? BackSpace"
            - "to_letters comma _ space_short / . Return"
    more_symbols:
        family: text
        page: more_symbols
        more_keys: symbols
        rows:
            - "~ ` | • √ π ÷ × ¶ ∆"
            - "[5] £ ¢ € ¥ ^ ° = { } [5]"
            - "to_symbols \\ © ® ™ § [ ] BackSpace"
            - "to_letters comma < space_short > . Return"
    email:
        family: email
        more_keys: letters
        extends: base
        replace: { comma: at, emoji: dot_com }
    url:
        family: url
        more_keys: letters
        extends: base
        replace: { comma: slash, emoji: dot_com }
    password:
        family: password
        more_keys: password
        extends: base
        replace: { emoji: at }
    number:
        family: number
        more_keys: number
        rows:
            - "1 2 3 minus"
            - "4 5 6 comma"
            - "7 8 9 BackSpace_pad"
            - "period 0 space_pad Return_pad"
    phone:
        family: phone
        more_keys: phone
        rows:
            - "1 2 3 minus"
            - "4 5 6 period"
            - "7 8 9 BackSpace_pad"
            - "to_phone_symbols 0 space_pad Return_pad"
    phone_symbols:
        family: phone
        page: phone_symbols
        more_keys: phone
        rows:
            - "( / ) minus"
            - "N pause comma period"
            - "star wait # BackSpace_pad"
            - "to_phone plus space_pad Return_pad"
    terminal:
        family: terminal
        page: letters
        more_keys: terminal
        extends: base
        replace: { comma: slash, emoji: dot, period: minus }
        rows:
            - { height: 0.75, keys: "Esc Tab Ctrl Alt ← ↓ ↑ →" }
    terminal_symbols:
        family: terminal
        page: symbols
        more_keys: symbols
        extends: symbols
        replace: { comma: "/", "/": "|", ".": minus }
        rows:
            - { height: 0.75, keys: "Esc Tab Ctrl Alt ← ↓ ↑ →" }
    terminal_more_symbols:
        family: terminal
        page: more_symbols
        more_keys: symbols
        extends: more_symbols
        replace: { comma: "/", ".": minus }
        rows:
            - { height: 0.75, keys: "Esc Tab Ctrl Alt ← ↓ ↑ →" }

buttons:
    shift:
        key_style: function
        action: shift
        outline: wide
        icon: key-shift-symbolic
    BackSpace:
        key_style: function
        outline: wide
        icon: edit-clear-symbolic
        action: erase
    BackSpace_pad:
        key_style: function
        icon: edit-clear-symbolic
        action: erase
    # Enter keeps the `done` look on every page and sends Return.
    Return:
        key_style: done
        outline: wide
        icon: key-enter-symbolic
        keysym: Return
    Return_pad:
        key_style: done
        icon: key-enter-symbolic
        keysym: Return
    to_symbols:
        key_style: function
        action: { page: symbols }
        outline: wide
        label: "?123"
    to_more_symbols:
        key_style: function
        action: { page: more_symbols }
        outline: wide
        label: "=\\<"
    to_letters:
        key_style: function
        action: { page: letters }
        outline: wide
        label: "ABC"
    to_phone_symbols:
        key_style: function
        action: { page: phone_symbols }
        label: "*#"
    to_phone:
        key_style: function
        action: { page: letters }
        label: "123"
    # No emoji page until Part 2: tapping logs "no view for page".
    emoji:
        key_style: emoji
        action: { page: emoji }
        icon: face-smile-symbolic
    space:
        outline: space
        label: " "
        text: " "
    space_short:
        outline: space_short
        label: " "
        text: " "
    space_pad:
        label: " "
        text: " "
    comma:
        label: ","
    period:
        label: "."
    at:
        label: "@"
    slash:
        label: "/"
    dot:
        label: "."
    minus:
        key_style: function
        label: "-"
    plus:
        label: "+"
    dot_com:
        key_style: bottom
        label: ".com"
        text: ".com"
    pause:
        key_style: bottom
        label: "Pause"
        text: ","
    wait:
        key_style: bottom
        label: "Wait"
        text: ";"
    star:
        label: "*"
        text: "*"
    Esc:
        key_style: strip
        outline: strip
        keysym: Escape
    Tab:
        key_style: strip
        outline: strip
        keysym: Tab
    Ctrl:
        key_style: strip
        outline: strip
        modifier: Control
        label: Ctrl
    Alt:
        key_style: strip
        outline: strip
        modifier: Alt
        label: Alt
    "←":
        key_style: strip
        outline: strip
        keysym: Left
        icon: go-previous-symbolic
    "↓":
        key_style: strip
        outline: strip
        keysym: Down
        icon: go-down-symbolic
    "↑":
        key_style: strip
        outline: strip
        keysym: Up
        icon: go-up-symbolic
    "→":
        key_style: strip
        outline: strip
        keysym: Right
        icon: go-next-symbolic
