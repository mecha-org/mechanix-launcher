# Long-press data. Keys are layout.yaml tokens; choices are space-separated.
# A hint is the corner label and is also the first choice (unless the choices
# already start with it, or the token is listed in `hint_only`).
# Data is lowercase; shift uppercases it at use.
sets:
  letters:
    hints: { q: "1", w: "2", e: "3", r: "4", t: "5", y: "6", u: "7", i: "8", o: "9", p: "0" }
    choices:
      a: "à á â ä æ ã å ā"
      o: "ó ô ö ò œ ø ō õ"
      e: "é è ê ë ē"
      u: "ú û ü ù ū"
      i: "í î ï ī ì"
      n: "ñ"
      c: "ç"
      s: "ß"
      period: ", ? ! # ) ( / ; ' @ : - \" + % &"
      dot_com: ".org .net .io .dev .co.uk"
  password:
    extends: letters
    hints:
      a: "@"
      s: "#"
      d: "$"
      f: "_"
      g: "&"
      h: "-"
      j: "+"
      k: "("
      l: ")"
      z: "*"
      x: "\""
      c: "'"
      v: ":"
      b: ";"
      n: "!"
      m: "?"
    choices:
      at: "# $ % &"
  terminal:
    hints:
      q: "1"
      w: "2"
      e: "3"
      r: "4"
      t: "5"
      y: "6"
      u: "7"
      i: "8"
      o: "9"
      p: "0"
      a: "|"
      s: "~"
      d: "$"
      f: "_"
      g: "&"
      h: "="
      j: "+"
      k: "("
      l: ")"
      z: "*"
      x: "\""
      c: "'"
      v: ":"
      b: ";"
      n: "\\"
      m: "`"
    choices:
      k: "( [ {"
      l: ") ] }"
      dot: "~ *"
  symbols:
    choices:
      "1": "¹ ½ ⅓ ¼ ⅛"
      "2": "² ⅔"
      "3": "³ ¾ ⅜"
      "4": "⁴"
      "5": "⅝"
      "7": "⅞"
      "0": "ⁿ ∅"
      "$": "¢ £ € ¥ ₱"
      "%": "‰"
      "-": "_ – — ·"
      "+": "±"
      "(": "< { ["
      ")": "> } ]"
      "*": "† ‡ ★"
      "\"": "„ “ ” « »"
      "'": "‚ ‘ ’ ‹ ›"
      "!": "¡"
      "?": "¿"
      ".": "…"
      "•": "♪ ♥ ♠ ♦ ♣"
      "π": "Π"
      "¶": "§"
      "^": "↑ ↓ ← →"
      "°": "′ ″"
      "=": "≠ ≈ ∞"
      "<": "‹ ≤ «"
      ">": "› ≥ »"
  phone:
    hints:
      "0": "+"
      "2": "ABC"
      "3": "DEF"
      "4": "GHI"
      "5": "JKL"
      "6": "MNO"
      "7": "PQRS"
      "8": "TUV"
      "9": "WXYZ"
    hint_only: ["2", "3", "4", "5", "6", "7", "8", "9"]
    choices:
      "0": "+"
      minus: "+"
  number:
    choices:
      minus: "+"
