[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
mecha-wayland.workspace = true
status-bar.workspace = true
keyboard.workspace = true
screen.workspace = true
home.workspace = true
app-drawer.workspace = true
apps.workspace = true
running-apps.workspace = true
notifications.workspace = true
quick-settings.workspace = true
control-center.workspace = true
nav.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
members = [
    ".",
    "crates/status-bar",
    "crates/home",
    "crates/gestures",
    "crates/screen",
    "crates/app-drawer",
    "crates/apps",
    "crates/running-apps",
    "crates/notifications",
    "crates/quick-settings",
    "crates/nav",
    "crates/keyboard",
    "crates/services",
    "crates/assets",
    "crates/pulseaudio", "crates/control-center",
]
resolver = "3"

[workspace.dependencies]
mecha-wayland = { git = "https://github.com/mecha-org/mecha-wayland", branch = "dev" }
status-bar = { path = "crates/status-bar" }
home = { path = "crates/home" }
gestures = { path = "crates/gestures" }
screen = { path = "crates/screen" }
app-drawer = { path = "crates/app-drawer" }
apps = { path = "crates/apps" }
running-apps = { path = "crates/running-apps" }
notifications = { path = "crates/notifications" }
quick-settings = { path = "crates/quick-settings" }
control-center = { path = "crates/control-center" }
nav = { path = "crates/nav" }
keyboard = { path = "crates/keyboard" }
services = { path = "crates/services" }
assets = { path = "crates/assets" }

# Local development override — assumes mecha-wayland is cloned as a sibling
# directory: ../mecha-wayland
# [patch."https://github.com/mecha-org/mecha-wayland"]
# mecha-wayland = { path = "../mecha-wayland" }
